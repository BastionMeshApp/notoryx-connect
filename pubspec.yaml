name: bastion
description: Independent field-mesh companion compatible with Meshtastic® firmware.
publish_to: none
version: 0.1.2+3

environment:
  sdk: '>=3.12.0 <4.0.0'
  flutter: '>=3.47.7'

dependencies:
  flutter:
    sdk: flutter
  universal_ble: 2.3.0
  shared_preferences: 2.5.6
  cryptography: 2.9.0
  protobuf: 6.1.0
  fixnum: 1.1.1
  qr_flutter: 4.1.0
  flutter_foreground_task: 11.0.3
  flutter_map: 8.3.2
  flutter_local_notifications: 22.3.1
  geolocator: 14.1.1
  mobile_scanner: 7.4.2
  path_provider: 2.1.6
  latlong2: 0.10.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - branding/bastion-icon.png
    - licenses/meshtastic-protobufs-GPL-3.0.txt

flutter_launcher_icons:
  android: true
  ios: false
  image_path: branding/bastion-icon.png
  adaptive_icon_background: '#0B0E11'
  adaptive_icon_foreground: branding/bastion-icon.png
