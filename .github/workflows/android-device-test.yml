name: Bastion Android Emulator Smoke Test
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'lib/**'
      - 'scripts/prepare_android.py'
      - 'scripts/android_smoke_test.sh'
      - 'test/android_smoke_script_test.py'
      - '.github/workflows/android-device-test.yml'
permissions:
  contents: read
jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify smoke-test failure handling
        run: python3 test/android_smoke_script_test.py
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
      - run: |
          flutter create --platforms=android --org org.backcountrysignal --project-name bastion .
          rm -f test/widget_test.dart
          python3 scripts/prepare_android.py
          flutter pub get
          dart run flutter_launcher_icons
          flutter build apk --debug
      - name: Enable emulator hardware acceleration
        run: |
          # Limit device access to this disposable runner's job user.
          test -e /dev/kvm
          sudo chown "$(id -un)" /dev/kvm
          sudo chmod u+rw /dev/kvm
          test -r /dev/kvm && test -w /dev/kvm
      - name: Boot emulator and install APK
        timeout-minutes: 15
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          disable-linux-hw-accel: false
          script: bash scripts/android_smoke_test.sh
      - name: Upload emulator log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Bastion-Emulator-Log
          path: |
            emulator-log.txt
            emulator-process-log.txt
            emulator-launch.txt
            emulator-screen.png
          if-no-files-found: warn
