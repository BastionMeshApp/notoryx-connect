name: Bastion Security and Secret Scan
on:
  push:
  pull_request:
  workflow_dispatch:
concurrency:
  group: bastion-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  secrets:
    permissions:
      contents: read
      # Gitleaks reads the commit list for pull_request events, including Dependabot.
      pull-requests: read
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Scan tracked history for secrets
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
      - run: flutter pub get --enforce-lockfile
      - name: Report outdated dependencies
        run: flutter pub outdated
