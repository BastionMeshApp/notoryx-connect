name: NOTORYX APK Size Monitor
on:
  push:
    branches:
      - main
  workflow_dispatch:
concurrency:
  group: bastion-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  size:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
      - name: Install Android NDK (retries corrupted downloads)
        uses: ./.github/actions/install-android-ndk
      - run: |
          flutter create --no-pub --platforms=android --org com.bastionmesh --project-name bastion .
          # flutter create replaces pubspec.lock with a template; restore the committed one.
          git checkout -- pubspec.lock
          rm -f test/widget_test.dart
          python3 scripts/prepare_android.py
          flutter pub get --enforce-lockfile
          dart run flutter_launcher_icons
          # Fails if the Android launcher icon was not generated (e.g. a stray
          # flutter_launcher_icons-*.yaml makes the tool skip the main config).
          test -f android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          flutter build apk --release --target-platform android-arm64
      - name: Record APK size
        run: |
          bytes=$(stat -c%s build/app/outputs/flutter-apk/app-release.apk)
          printf 'APK bytes: %s\n' "$bytes" | tee APK-SIZE.txt
          echo "### APK size: $bytes bytes" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: NOTORYX-APK-Size-${{ github.run_number }}
          path: APK-SIZE.txt
          retention-days: 30
