name: Bastion PR Quality Gate
on:
  pull_request:
    branches:
      - main
      - feature/bastion-beta
    paths:
      - 'lib/**'
      - 'test/**'
      - 'pubspec.yaml'
      - '.github/workflows/pr-quality.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - name: Static analysis
        run: flutter analyze
      - name: Unit and widget tests
        run: flutter test --reporter expanded
      - name: Upload field screen QA
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Bastion-Field-Screen-QA
          path: build/field-qa/
          if-no-files-found: ignore
