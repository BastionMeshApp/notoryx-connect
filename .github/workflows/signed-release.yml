name: Bastion Signed Release Candidate
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  signed:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      BASTION_KEYSTORE_BASE64: ${{ secrets.BASTION_KEYSTORE_BASE64 }}
      BASTION_STORE_PASSWORD: ${{ secrets.BASTION_STORE_PASSWORD }}
      BASTION_KEY_PASSWORD: ${{ secrets.BASTION_KEY_PASSWORD }}
      BASTION_KEY_ALIAS: ${{ secrets.BASTION_KEY_ALIAS }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
      - name: Prepare Android and signing
        run: |
          python3 scripts/check_release_hygiene.py
          flutter create --no-pub --platforms=android --org org.backcountrysignal --project-name bastion .
          # flutter create replaces pubspec.lock with a template; restore the committed one.
          git checkout -- pubspec.lock
          rm -f test/widget_test.dart
          python3 scripts/prepare_android.py
          python3 scripts/configure_android_signing.py
          flutter pub get --enforce-lockfile
          dart run flutter_launcher_icons
      - name: Validate
        run: |
          python3 test/release_package_test.py
          flutter analyze
          flutter test
      - name: Build signed candidate and archive symbols
        run: |
          flutter build apk --release --target-platform android-arm64 --obfuscate --split-debug-info=build/release-symbols
          flutter build appbundle --release --obfuscate --split-debug-info=build/bundle-symbols
      - name: Verify signature and package
        run: |
          mkdir -p build/signed-package
          cp build/app/outputs/flutter-apk/app-release.apk build/signed-package/Bastion-Signed-RC.apk
          cp build/app/outputs/bundle/release/app-release.aab build/signed-package/Bastion-Signed-RC.aab
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --verbose --print-certs build/signed-package/Bastion-Signed-RC.apk > build/signed-package/SIGNATURE.txt
          python3 scripts/verify_release_package.py build/signed-package/Bastion-Signed-RC.apk build/signed-package/SIGNATURE.txt
          jarsigner -verify build/signed-package/Bastion-Signed-RC.aab
          (cd build/signed-package && sha256sum Bastion-Signed-RC.apk Bastion-Signed-RC.aab > SHA256SUMS.txt)
          printf 'Commit: %s\nRun: %s\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" > build/signed-package/BUILD-INFO.txt
      - uses: actions/upload-artifact@v7
        with:
          name: Bastion-Signed-Candidate-${{ github.run_number }}
          path: |
            build/signed-package/
            build/release-symbols/
            build/bundle-symbols/
          retention-days: 90
          if-no-files-found: error
      - name: Remove signing material
        if: always()
        run: rm -f android/app/bastion-upload.p12
